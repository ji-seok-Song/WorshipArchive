<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#4b49b7">
    <title>{{ page.title | default: site.title | escape }} · 찬양서랍</title>
    <style>
      :root {
        color-scheme: light dark;
        --accent: #4b49b7;
        --surface: #ffffff;
        --background: #f5f5fa;
        --text: #17171c;
        --secondary: #5f606b;
        --border: #dedee8;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --accent: #aaa8ff;
          --surface: #1d1d22;
          --background: #111114;
          --text: #f2f2f7;
          --secondary: #b8b8c2;
          --border: #393942;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        font-size: 17px;
        line-height: 1.7;
      }

      header, main, footer {
        width: min(760px, calc(100% - 32px));
        margin-inline: auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 0 16px;
      }

      header a { color: var(--text); text-decoration: none; }
      header strong { font-size: 20px; }
      nav { display: flex; gap: 16px; font-size: 15px; }
      nav a { color: var(--secondary); }

      main {
        min-height: calc(100vh - 180px);
        padding: 28px clamp(22px, 5vw, 52px) 52px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgb(30 30 45 / 8%);
      }

      h1, h2 { line-height: 1.3; }
      h1 { margin-top: 0; font-size: clamp(30px, 7vw, 42px); }
      h2 { margin-top: 2em; font-size: 23px; }
      a { color: var(--accent); text-underline-offset: 3px; }
      li + li { margin-top: 7px; }

      footer {
        padding: 24px 0 32px;
        color: var(--secondary);
        font-size: 14px;
        text-align: center;
      }

      @media (max-width: 560px) {
        header { align-items: flex-start; flex-direction: column; }
        main { border-radius: 18px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="{{ '/' | relative_url }}"><strong>찬양서랍</strong></a>
      <nav aria-label="주요 메뉴">
        <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
        <a href="{{ '/support/' | relative_url }}">지원</a>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer>© 2026 Jiseok Song</footer>
  </body>
</html>
